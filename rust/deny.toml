[advisories]
version = 2
ignore = [
    # derivative is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0388",
    # paste is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0436",
    # quick-xml vulnerabilities — no fix released yet, low risk (parse-only, trusted input)
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # fxhash is unmaintained — transitive dep of scraper->selectors, no alternative without changing scraper
    "RUSTSEC-2025-0057",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Transitive duplicates from flutter_rust_bridge_codegen (build-time only, never in release binary)
skip = [
    "ahash",
    "bitflags",
    "block-buffer",
    "convert_case",
    "cpufeatures",
    "crypto-common",
    "cssparser",
    "digest",
    "ego-tree",
    "getrandom",
    "hashbrown",
    "heck",
    "r-efi",
    "syn",
    "toml",
    "windows-sys",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
