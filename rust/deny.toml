[advisories]
version = 2
ignore = [
    # derivative is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0388",
    # paste is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained — will switch to skrifa (fontations) in future
    "RUSTSEC-2026-0192",
    # archived crate — transitive dep of flutter_rust_bridge, no fix
    "RUSTSEC-2023-0089",
    # fxhash unmaintained — transitive dep of flutter_rust_bridge_codegen, no fix
    "RUSTSEC-2025-0057",
    # web-time unmaintained — transitive dep of flutter_rust_bridge, no fix
    "RUSTSEC-2024-0384",
    # instant archived — build-time dep via serial_test, no fix
    "RUSTSEC-2023-0081",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Transitive duplicates from flutter_rust_bridge_codegen (build-time only, never in release binary)
skip = [
    "ahash",
    "bitflags",
    "convert_case",
    "cpufeatures",
    "cssparser",
    "cssparser-macros",
    "derive_more",
    "foldhash",
    "getrandom",
    "hashbrown",
    "heck",
    "inotify",
    "itertools",
    "itoa",
    "mio",
    "notify",
    "phf",
    "phf_codegen",
    "phf_generator",
    "phf_macros",
    "phf_shared",
    "ptr_meta",
    "ptr_meta_derive",
    "r-efi",
    "rand",
    "rand_chacha",
    "rand_core",
    "rkyv",
    "rkyv_derive",
    "selectors",
    "servo_arc",
    "siphasher",
    "syn",
    "thiserror",
    "thiserror-impl",
    "toml",
    "unicode-width",
    "wasi",
    "windows-sys",
    "windows-targets",
    "windows_aarch64_gnullvm",
    "windows_aarch64_msvc",
    "windows_i686_gnu",
    "windows_i686_msvc",
    "windows_x86_64_gnu",
    "windows_x86_64_gnullvm",
    "windows_x86_64_msvc",
    "dashmap",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
