[advisories]
ignore = [
    # derivative is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0388",
    # paste is unmaintained — pinned by flutter_rust_bridge_codegen, no fix available
    "RUSTSEC-2024-0436",
    # number_prefix is unmaintained — pinned by indicatif (transitive dep of FRB codegen)
    "RUSTSEC-2025-0119",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    "CC0-1.0",
]

[sources]
unknown-registry = "warn"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
