[package]
name = "glibusta_core"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"

[lib]
name = "glibusta_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
pdf = ["pdfium-render/image_latest", "image"]

[dependencies]
aho-corasick = "1"
ammonia = "4"
anyhow = "1"
base64 = "0.22"
bitcode = "0.6"
bitflags = "2"
blake3 = "1"
bon = "3"
bstr = "1"
bumpalo = "3"
byteorder = "1"

# ─── Файловая система ──────────────────────────────────────────────────
camino = "1"
chardetng = "1.0"
compact_str = "0.8"
crc32fast = "1"
csscolorparser = "0.7"
dashmap = "6"
deunicode = "1"

# ─── Кодировки ─────────────────────────────────────────────────────────
encoding_rs = "0.8"
# ─── FFI / Bridge ──────────────────────────────────────────────────────
flutter_rust_bridge = "=2.12.0"

# ─── Поиск по библиотеке ───────────────────────────────────────────────
fst = "0.4"
globset = "0.4"
html5ever = "0.39"
ignore = "0.4"

# ─── Изображения ───────────────────────────────────────────────────────
# image crate is gated behind pdf feature
image = { version = "0.25", optional = true }

# ─── Структуры данных ──────────────────────────────────────────────────
indexmap = { version = "2", features = ["serde"] }
itertools = "0.13"
jwalk = "0.8"

# ─── CSS / Layout ──────────────────────────────────────────────────────
lightningcss = "1.0.0-alpha.71"
log = "0.4"
lol_html = "0.4"
lopdf = { version = "0.37", optional = true }
lru = "0.18"
memchr = "2"
memmap2 = "0.9"
miette = "7"

# ─── Кэш и память ──────────────────────────────────────────────────────
moka = { version = "0.12", features = ["sync"] }
nom = { version = "8.0.0", features = ["std"] }
notify = "7"
once_cell = "1"
parking_lot = "0.12"
pathdiff = "0.2"

# ─── PDF ───────────────────────────────────────────────────────────────
pdfium-render = { version = "0.9", optional = true }
postcard = { version = "1", features = ["alloc"] }
pulldown-cmark = "0.13"

# ─── XML / HTML парсинг ────────────────────────────────────────────────
quick-xml = { version = "0.41", features = ["serialize"] }

# ─── Параллелизм ───────────────────────────────────────────────────────
rayon = "1"

# ─── Хранение / KV ─────────────────────────────────────────────────────
redb = "2"

# ─── Регулярки ─────────────────────────────────────────────────────────
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
# zune-image = "0.5"  # TODO: replace image when stable

# ─── SVG ───────────────────────────────────────────────────────────────
resvg = { version = "0.44", optional = true }
rkyv = "0.8"
roxmltree = "0.21"
scraper = "0.27"

# ─── Сериализация ──────────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ─── Хэширование ───────────────────────────────────────────────────────
sha2 = "0.10"
simdutf8 = "0.1"
similar = "2"
slotmap = { version = "1", features = ["serde"] }
smallvec = "1"

# ─── Enum / Builder / Errors ───────────────────────────────────────────
strum = { version = "0.26", features = ["derive"] }
taffy = "0.4"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"

# ─── Шрифты ────────────────────────────────────────────────────────────
ttf-parser = "0.25"
ulid = "1"
unicode-normalization = "0.1"

# ─── Текст, Unicode, поиск ─────────────────────────────────────────────
unicode-segmentation = "1"

# ─── Утилиты ───────────────────────────────────────────────────────────
url = "2"

# ─── ID generation ─────────────────────────────────────────────────────
uuid = { version = "1", features = ["v4"] }
whatlang = "0.18"

# ─── Парсинг бинарных форматов (MOBI/PRC) ──────────────────────────────
winnow = "0.7"

# ─── Архивы ────────────────────────────────────────────────────────────
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
flutter_rust_bridge_codegen = "=2.12.0"

[dev-dependencies]
insta = "1"
pretty_assertions = "1"

[lints.clippy]
all = { level = "warn", priority = -1 }

# Suppress pedantic/noise lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
trivially_copy_pass_by_ref = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
if_not_else = "allow"
match_same_arms = "allow"
redundant_else = "allow"
option_if_let_else = "allow"
must_use_unit = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# FRB generated code compatibility
module_inception = "allow"
should_implement_trait = "allow"

# ─── Release profile: minimize .so size ────────────────────────────────
[profile.release]
opt-level = "z"       # aggressive size optimization
lto = "fat"           # fat LTO — most aggressive dead code elimination
codegen-units = 1     # single codegen unit = better optimization (slower build)
panic = "abort"       # remove stack unwinding code on panic
strip = "symbols"     # strip debug symbols from .so

# Compile all dependencies with size optimization too
[profile.release.package."*"]
opt-level = "z"

# SIMD crates need opt-level 3 or inlining breaks
[profile.release.package.simdutf8]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3
