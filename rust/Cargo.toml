[package]
name = "glibusta_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "glibusta_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

zip = "2"
flate2 = "1"

quick-xml = { version = "0.37", features = ["serialize"] }
roxmltree = "0.20"
encoding_rs = "0.8"
base64 = "0.22"

sha2 = "0.10"
walkdir = "2"
memchr = "2"
regex = "1"

[build-dependencies]
flutter_rust_bridge_codegen = "=2.11.0"
