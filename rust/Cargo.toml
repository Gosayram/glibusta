[package]
name = "glibusta_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "glibusta_core"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }

zip = "2"
flate2 = "1"

quick-xml = { version = "0.37", features = ["serialize"] }
roxmltree = "0.20"
encoding_rs = "0.8"
base64 = "0.22"

sha2 = "0.10"
walkdir = "2"
memchr = "2"
regex = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }

[lints.clippy]
all = { level = "warn", priority = -1 }

# Suppress pedantic/noise lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
items_after_statements = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
too_many_lines = "allow"
too_many_arguments = "allow"
struct_excessive_bools = "allow"
suboptimal_flops = "allow"
trivially_copy_pass_by_ref = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
if_not_else = "allow"
match_same_arms = "allow"
redundant_else = "allow"
option_if_let_else = "allow"
must_use_unit = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"

# FRB generated code compatibility
module_inception = "allow"
should_implement_trait = "allow"

[build-dependencies]
flutter_rust_bridge_codegen = "=2.11.0"

# ─── Release profile: minimize .so size ────────────────────────────────
[profile.release]
opt-level = "z"       # aggressive size optimization
lto = true            # Link Time Optimization — dead code elimination across crates
codegen-units = 1     # single codegen unit = better optimization (slower build)
panic = "abort"       # remove stack unwinding code on panic
strip = true          # strip debug symbols from .so
