components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Session cookie obtained from /user/login

  parameters:
    BookId:
      name: bookId
      in: path
      required: true
      description: Unique book identifier
      schema:
        type: string

    AuthorId:
      name: authorId
      in: path
      required: true
      description: Unique author identifier
      schema:
        type: string

    SeriesId:
      name: seriesId
      in: path
      required: true
      description: Unique series identifier
      schema:
        type: string

    GenreId:
      name: genreId
      in: path
      required: true
      description: Genre identifier (slug or numeric)
      schema:
        type: string

    UserId:
      name: userId
      in: path
      required: true
      description: Unique user identifier
      schema:
        type: string

    OpdsPage:
      name: page
      in: path
      required: true
      description: Page number (0-indexed)
      schema:
        type: integer
        minimum: 0
        default: 0

  schemas:
    # ── Primitives ──────────────────────────────────────────────
    BookId:
      type: string
      description: Unique book identifier

    AuthorId:
      type: string
      description: Unique author identifier

    AuthorName:
      type: string
      description: Full author name

    SeriesId:
      type: string
      description: Unique series identifier

    GenreId:
      type: string
      description: Genre slug or numeric ID

    # ── Books ───────────────────────────────────────────────────
    BookSummary:
      type: object
      description: Brief book info from search results
      properties:
        id:
          type: string
        name:
          type: string
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'

    AuthorSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    BookDetailsPage:
      type: object
      description: Parsed book details from HTML page
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        coverUrl:
          type: string
          nullable: true
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'
        formats:
          type: array
          items:
            type: string
          description: "Available formats: fb2, epub, mobi, pdf, txt, djvu"
        downloadUrls:
          type: array
          items:
            type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesSummary'

    SeriesSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    GenreSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string

    # ── Authors ─────────────────────────────────────────────────
    AuthorDetailsPage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    # ── Series ──────────────────────────────────────────────────
    SeriesPage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    # ── Genres ──────────────────────────────────────────────────
    GenrePage:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    GenreListPage:
      type: object
      properties:
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'

    # ── Search ──────────────────────────────────────────────────
    SearchResultsPage:
      type: object
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorSummary'
        series:
          type: array
          items:
            $ref: '#/components/schemas/SeriesSummary'
        genres:
          type: array
          items:
            $ref: '#/components/schemas/GenreSummary'
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    PaginationInfo:
      type: object
      properties:
        currentPage:
          type: integer
        totalPages:
          type: integer
        totalCount:
          type: integer
          nullable: true
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean

    # ── Recent ──────────────────────────────────────────────────
    RecentPage:
      type: object
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'
        totalBooks:
          type: integer

    # ── OPDS ────────────────────────────────────────────────────
    OpdsFeed:
      type: object
      description: OPDS 1.2 Atom feed
      properties:
        id:
          type: string
        title:
          type: string
        updated:
          type: string
          format: date-time
        entries:
          type: array
          items:
            $ref: '#/components/schemas/OpdsEntry'

    OpdsEntry:
      type: object
      description: Single OPDS entry (book or author)
      properties:
        title:
          type: string
        id:
          type: string
        updated:
          type: string
          format: date-time
        authors:
          type: array
          items:
            $ref: '#/components/schemas/OpdsAuthor'
        categories:
          type: array
          items:
            type: string
        coverUrl:
          type: string
          nullable: true
        downloads:
          type: array
          items:
            $ref: '#/components/schemas/OpdsDownload'
        description:
          type: string

    OpdsAuthor:
      type: object
      properties:
        name:
          type: string
        uri:
          type: string

    OpdsDownload:
      type: object
      properties:
        link:
          type: string
        type:
          type: string
          description: MIME type
          enum:
            - application/epub
            - application/fb2+zip
            - application/html+zip
            - application/pdf+rar
            - application/pdf+zip
            - application/rtf+zip
            - application/txt+zip
            - application/x-mobipocket-ebook
            - application/djvu
            - application/msword
            - application/x-rar-compressed
            - application/pdf

    # ── User ────────────────────────────────────────────────────
    UserProfilePage:
      type: object
      properties:
        userId:
          type: string
        username:
          type: string
        tabs:
          type: array
          items:
            type: string

    # ── Bookshelf ───────────────────────────────────────────────
    BookshelfPage:
      type: object
      properties:
        userId:
          type: string
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummary'

    # ── Messages ────────────────────────────────────────────────
    MessagesPage:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    Message:
      type: object
      properties:
        sender:
          type: string
        subject:
          type: string
        date:
          type: string

    # ── Forms ───────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [name, pass]
      properties:
        name:
          type: string
          description: Username
        pass:
          type: string
          format: password
          description: Password
        persistent_login:
          type: string
          description: "Set to '1' to stay logged in"
        form_build_id:
          type: string
        form_id:
          type: string
          enum: [user_login]

    EditProfileRequest:
      type: object
      properties:
        mail:
          type: string
          format: email
        pass[pass1]:
          type: string
          format: password
        pass[pass2]:
          type: string
          format: password
        form_build_id:
          type: string
        form_token:
          type: string

    SendMessageRequest:
      type: object
      required: [recipient, subject, body]
      properties:
        recipient:
          type: string
          description: Recipient username
        subject:
          type: string
        body:
          type: string
        op:
          type: string
          enum: [Отправить сообщение, Предпросмотр сообщения]

    BookMailRequest:
      type: object
      properties:
        to:
          type: string
          format: email
        format:
          type: string
          enum: [fb2, html, txt, rtf, epub, mobi]
        bookmailFormParams:
          type: string
          enum: [Отправить]

    PolkaAddRequest:
      type: object
      properties:
        flag:
          type: string
          enum: [on, ""]
        body:
          type: string
          description: Review text
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Book rating (1-5)

    AuthorBulkRequest:
      type: object
      properties:
        readedall:
          type: string
          description: Mark selected as read
        bookscomp:
          type: string
          description: Compare selected books

    # ── Pages ───────────────────────────────────────────────────
    HtmlPage:
      type: object
      description: Generic HTML page wrapper
      properties:
        title:
          type: string
        content:
          type: string
          description: Raw HTML content
