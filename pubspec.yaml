name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^15.1.3

  # HTTP client
  dio: ^5.9.0

  # HTML parsing
  html: ^0.15.1

  # Localization
  intl: ^0.19.0

  # Local database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42

  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # File system
  path: ^1.9.0
  file: ^7.0.1

  # Utilities
  async: ^2.13.0
  collection: ^1.19.1
  crypto: ^3.0.7
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  freezed: ^2.5.8
  json_serializable: ^6.9.5
  build_runner: ^2.5.4
  drift_dev: ^2.28.0

flutter:
  uses-material-design: true

  assets:
    - lib/l10n/app_ru.arb
    - lib/l10n/app_en.arb