name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # Routing
  go_router: ^15.0.0

  # HTTP client
  dio: ^5.7.0

  # HTML parsing
  html: ^0.15.0

  # Localization
  intl: ^0.19.0

  # Local database
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.9.0

  # Code generation
  json_annotation: ^4.9.0

  # File system
  path: ^1.9.0
  file: ^7.0.0

  # Utilities
  async: ^2.11.0
  collection: ^1.19.0
  crypto: ^3.0.0
  package_info_plus: ^8.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  json_serializable: ^6.8.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - lib/l10n/app_ru.arb
    - lib/l10n/app_en.arb