name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^15.1.3

  # HTTP client
  dio: ^5.9.0

  # HTML parsing
  html: ^0.15.1

  # Localization
  intl: ^0.19.0

  # Local database
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42

  # File system
  path: ^1.9.0
  file: ^7.0.1

  # Utilities
  async: ^2.13.0
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter_dotenv: ^6.0.1
  package_info_plus: ^8.3.1
  path_provider: ^2.1.5
  uuid: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_lint: ^3.1.3
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/l10n/app_ru.arb
    - lib/l10n/app_en.arb
