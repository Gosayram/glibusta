name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.0+0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management & DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.3.0

  # HTTP client
  dio: ^5.9.2

  # HTML parsing
  html: ^0.15.1

  # Localization
  intl: ^0.19.0

  # Local database
  drift: ^2.33.0
  sqlite3_flutter_libs: ^0.5.42

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # File system
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^10.0.0

  # Downloads
  background_downloader: ^9.5.5

  # Reader formats
  epubx: 4.0.0
  xml: ^6.0.0

  # Utilities
  async: ^2.13.0
  collection: ^1.19.1
  crypto: ^3.0.7
  flutter_dotenv: ^6.0.1
  package_info_plus: ^8.3.1
  device_info_plus: ^11.4.0
  uuid: ^4.5.0
  logging: ^1.3.0
  url_launcher: ^6.3.2
  skeletonizer: ^2.0.0
  connectivity_plus: ^6.1.3
  permission_handler: ^11.4.0

  # Desktop file selection (replaces desktop_drop which doesn't support SwiftPM)
  file_selector: ^1.0.3

  # Android-specific
  wakelock_plus: ^1.2.8
  dynamic_color: ^1.7.0

  # UI & Theming
  flex_color_scheme: ^8.4.0
  flutter_animate: ^4.5.2

  # Analytics & Monitoring
  sentry_flutter: ^9.0.0

  file: any
  shared_preferences: ^2.5.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^10.0.0
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.4-dev.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/l10n/app_ru.arb
    - lib/l10n/app_en.arb

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
