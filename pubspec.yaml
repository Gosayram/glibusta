name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.3+2083

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.3.0

  # HTTP client
  dio: ^5.10.0

  # Background downloads
  background_downloader: ^9.5.6

  # HTML parsing
  html: ^0.15.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Local database
  drift: ^2.34.1
  drift_flutter: ^0.3.1
  sqlite3: ^3.4.0

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # File system
  path: ^1.9.0
  path_provider: ^2.1.6
  file_picker: ^12.0.0-beta.7
  receive_sharing_intent: ^1.9.0

  # Reader formats
  pdfrx: ^2.4.7
  xml: ^7.0.1
  archive: ^4.0.0

  # Encoding detection
  flutter_charset_detector: ^6.0.0
  fl_charset: ^1.0.2

  # Utilities
  collection: ^1.19.0
  image: ^4.5.4
  crypto: ^3.0.7
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0
  uuid: ^4.5.0
  logging: ^1.3.0
  url_launcher: ^6.3.2
  skeletonizer: ^2.0.0
  connectivity_plus: ^7.2.0

  # Android-specific
  wakelock_plus: ^1.6.0
  battery_plus: ^7.1.0
  dynamic_color: ^1.8.0

  # UI & Theming
  flex_color_scheme: ^8.4.0
  flutter_animate: ^4.5.2
  flutter_smart_dialog: ^5.1.0

  # Analytics & Monitoring
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.2.0
  native_dio_adapter: ^1.6.0
  flutter_local_notifications: ^22.0.1
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio: ^0.10.6
  cached_network_image: ^3.4.1
  flutter_rust_bridge: 2.12.0
  flutter_tts: ^4.2.5
  flutter_svg: ^2.3.0

  # --- Reader: scroll, position, brightness ---
  scrollable_positioned_list: ^0.3.8
  visibility_detector: ^0.4.0
  screen_brightness: ^2.0.0

  # --- Hooks (reduces StatefulWidget boilerplate) ---
  flutter_hooks: ^0.21.0
  hooks_riverpod: ^3.3.2

  # --- UI: skeletons, grids, portals ---
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_portal: ^1.1.0

  # --- Text & clipboard ---
  defer_pointer: ^0.0.2

  # --- Background tasks ---
  workmanager: ^0.9.0+3

  # --- Structured logging ---
  talker: ^5.1.17

  # --- Deep linking ---
  app_links: ^7.2.1
  in_app_review: ^2.0.12
  upgrader: ^13.5.0
  in_app_update: ^5.0.0
  flutter_displaymode: ^0.7.0

  powersync: ^2.3.1

  http: any
  talker_flutter: ^5.1.17
dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.4-dev.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  mocktail: ^1.0.4
  go_router_builder: ^4.3.0
  integration_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

  # --- E2E testing ---
  patrol: ^4.6.1

  # --- Golden tests ---
  alchemist: ^0.14.0

  # --- Test data ---
  faker: ^2.0.0
  leak_tracker_flutter_testing: ^3.0.10
  leak_tracker: ^11.0.2
  accessibility_tools: ^2.8.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
