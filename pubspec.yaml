name: glibusta
description: Cross-platform book library app for Flibusta
publish_to: 'none'
version: 0.1.3+2017

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Routing
  go_router: ^17.3.0

  # HTTP client
  dio: ^5.9.2

  # HTML parsing
  html: ^0.15.1

  # Localization
  intl: ^0.20.2

  # Local database
  drift: ^2.34.0
  drift_flutter: ^0.3.0

  # Models / serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # File system
  path: ^1.9.0
  path_provider: ^2.1.5
  file_picker: ^12.0.0-beta.5
  file_selector: ^1.0.4
  receive_sharing_intent: ^1.8.0

  # Downloads
  background_downloader: ^9.5.5

  # Reader formats
  pdfrx: ^2.4.3
  xml: ^7.0.1
  archive: ^4.0.0

  # Encoding detection
  flutter_charset_detector: ^6.0.0
  fl_charset: ^1.0.2

  # Utilities
  collection: ^1.19.0
  image: ^4.5.4
  crypto: ^3.0.7
  flutter_dotenv: ^6.0.1
  package_info_plus: ^10.1.0
  device_info_plus: ^13.1.0
  uuid: ^4.5.0
  logging: ^1.3.0
  url_launcher: ^6.3.2
  skeletonizer: ^2.0.0
  connectivity_plus: ^7.1.1

  # Android-specific
  wakelock_plus: ^1.6.0
  dynamic_color: ^1.8.0

  # UI & Theming
  flex_color_scheme: ^8.4.0
  flutter_animate: ^4.5.2

  # Analytics & Monitoring
  file: any
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  share_plus: ^13.1.0
  native_dio_adapter: ^1.6.0
  flutter_local_notifications: ^22.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0
  riverpod_lint: ^3.1.3
  riverpod_generator: ^4.0.4-dev.1
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - lib/l10n/app_ru.arb
    - lib/l10n/app_en.arb

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/InterVariable.ttf
        - asset: assets/fonts/InterVariable-Italic.ttf
          style: italic
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
