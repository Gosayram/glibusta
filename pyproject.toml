[tool.ruff]
target-version = "py312"
line-length = 100
src = ["scripts"]
exclude = [
  ".dart_tool",
  ".git",
  "android/.gradle",
  "build",
  "coverage",
  "dist",
  "macos/Flutter/ephemeral",
  "test_results",
]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PTH",
  "RET",
  "RUF",
  "SIM",
  "UP",
  "W",
]
ignore = [
  "T201",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
