[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["scripts"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    ".dart_tool",
    "android/.gradle",
    "coverage",
    "macos/Flutter/ephemeral",
    "test_results",
]

[tool.ruff.lint]
select = [
    "E4",    # pycodestyle errors (default)
    "E7",    # pycodestyle errors (default)
    "E9",    # pycodestyle errors (default)
    "F",     # pyflakes (default)
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "I",     # isort
    "N",     # pep8-naming
    "PERF",  # perflint
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "RUF",   # ruff-specific rules
    "SIM",   # flake8-simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
ignore = [
    "T201",    # print found (allowed in scripts)
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "ANN201",  # missing return type annotation
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
]

[tool.ruff.lint.isort]
known-first-party = ["scripts"]
combine-as-imports = true
force-single-line = false

[tool.ruff.lint.flake8-builtins]
allowed-modules = ["secrets"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"
