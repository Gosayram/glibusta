version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Almaty'
    commit-message:
      prefix: '[CI] - update'

  - package-ecosystem: 'pub'
    directory: '/'
    target-branch: 'main'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Almaty'
    commit-message:
      prefix: '[UPD] - update'
    ignore:
      - dependency-name: 'flutter_rust_bridge'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'cargo'
    directory: '/rust'
    target-branch: 'main'
    schedule:
      interval: 'daily'
      time: '09:00'
      timezone: 'Asia/Almaty'
    commit-message:
      prefix: '[UPD] - update'
    ignore:
      - dependency-name: 'flutter_rust_bridge'
        update-types: ['version-update:semver-major']
      - dependency-name: 'flutter_rust_bridge_codegen'
        update-types: ['version-update:semver-major']
